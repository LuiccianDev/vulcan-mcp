[project]
name = "vulcan-mcp"
version = "0.3.0"
description = "Vulcan 12 integration through the Model Context Protocol (MCP)"
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    { name = "LuiccianDev"},
]
maintainers = [
    { name = "LuiccianDev"},
]
keywords = [
    "mcp",
    "model-context-protocol",
    "vulcan",
    "mining",
    "geology",
    "block-model",
    "drillholes",
    "fastmcp",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: Microsoft :: Windows",
]
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]>=1.20.0,<3",
    "pydantic>=2.0,<3",
]

[project.urls]
Homepage = "https://github.com/LuiccianDev/vulcan-mcp"
Repository = "https://github.com/LuiccianDev/vulcan-mcp"
Documentation = "https://github.com/LuiccianDev/vulcan-mcp/tree/master/docs"
Issues = "https://github.com/LuiccianDev/vulcan-mcp/issues"
Changelog = "https://github.com/LuiccianDev/vulcan-mcp/releases"

[project.scripts]
vulcan-mcp-server = "vulcan_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vulcan_mcp"]

[tool.uv]
package = true
[dependency-groups]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.1",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

[tool.ruff]
target-version = "py311"
line-length = 100
exclude = [
    ".git",
    ".venv",
    ".pytest_cache",
    "plugin",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
files = ["src/vulcan_mcp"]
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]
python_files = ["test_*.py"]
asyncio_mode = "strict"
markers = [
    "unit: Pure unit and AST tests without sockets",
    "harness: Tests using the mock Vulcan socket harness",
    "live: Live tests requiring Maptek Vulcan Desktop running",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.coverage.run]
source = ["src/vulcan_mcp"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
