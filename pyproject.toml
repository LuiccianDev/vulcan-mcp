[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vulcan_mcp"]

[tool.uv]
package = true

[project]
name = "vulcan-mcp"
version = "0.2.0"
description = "Maptek Vulcan 12 Desktop integration through the Model Context Protocol (MCP)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]>=1.20.0,<3",
    "pydantic>=2.0,<3",
]

[project.scripts]
vulcan-mcp-server = "vulcan_mcp.server:main"

[dependency-groups]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.23",
]
