name: Publish to PyPI

"on":
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      target_env:
        description: 'Target repository'
        required: true
        default: 'pypi'
        type: choice
        options:
          - pypi
          - testpypi

jobs:
  publish:
    name: Build, Attest & Publish to PyPI
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.event.inputs.target_env || 'pypi' }}
      url: ${{ (github.event.inputs.target_env == 'testpypi') && 'https://test.pypi.org/p/luiccian-vulcan-mcp' || 'https://pypi.org/p/luiccian-vulcan-mcp' }}
    permissions:
      id-token: write        # Mandatory for Trusted Publishing (OIDC)
      attestations: write    # Mandatory for PEP 740 Cryptographic Attestation
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build sdist and wheel
        run: uv build

      - name: Generate artifact attestation (PEP 740)
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: "dist/*"

      - name: Publish to PyPI (Production)
        if: ${{ (github.event.inputs.target_env || 'pypi') == 'pypi' }}
        run: uv publish

      - name: Publish to TestPyPI
        if: ${{ github.event.inputs.target_env == 'testpypi' }}
        run: uv publish --publish-url https://test.pypi.org/legacy/
