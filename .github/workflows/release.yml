name: Publish Release

"on":
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag name to release (e.g., v0.3.1)'
        required: true

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build Packages & Create GitHub Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build Distribution Packages (wheel + sdist)
        run: uv build

      - name: Package Vulcan Listener Bundle
        run: |
          python -c "import os, zipfile; zf = zipfile.ZipFile('dist/vulcan_listener.zip', 'w', zipfile.ZIP_DEFLATED); [zf.write(os.path.join(r, f)) for r, _, fs in os.walk('vulcan_listener') if '__pycache__' not in r for f in fs if not f.endswith('.pyc')]; zf.close()"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.whl
            dist/*.tar.gz
            dist/vulcan_listener.zip
          generate_release_notes: true
          draft: false
          prerelease: false
