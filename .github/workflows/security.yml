name: Security & Vulnerability Analysis

"on":
  schedule:
    - cron: '0 6 * * 1'  # Every Monday at 06:00 UTC
  push:
    branches: [master]
    paths:
      - 'src/**'
      - 'plugin/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/security.yml'
  pull_request:
    branches: [master]
    paths:
      - 'src/**'
      - 'plugin/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/security.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  security-events: write
  contents: read

jobs:
  codeql:
    name: CodeQL Analysis (Python)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: python

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3

  dependency-audit:
    name: Dependency Vulnerability Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Export requirements and audit
        run: |
          uv export --frozen --no-dev --no-hashes --no-emit-project --format requirements.txt -o requirements.txt
          uv run --with pip-audit pip-audit -r requirements.txt
